<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Spine Studio Renderer</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="../vendor/spine-player.js"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('stage');
  var params = new URLSearchParams(location.search);
  var cfg = {
    skel: params.get('skel') || 'assets/amiya/amiya.skel',
    atlas: params.get('atlas') || 'assets/amiya/amiya.atlas',
    png: params.get('png') || 'assets/amiya/amiya.png',
    width: parseInt(params.get('w') || '640', 10),
    height: parseInt(params.get('h') || '640', 10),
    background: params.get('bg') || '00000000',
    premultipliedAlpha: (params.get('premult') || '1') !== '0',
    mix: parseFloat(params.get('mix') || '0.2'),
    fit: parseFloat(params.get('fit') || '0.92'),
    views: null,
    // optional action whitelist: only these animations influence auto-fit,
    // so exports zoom to the actions actually used in the timeline
    actions: (function () { try { var a = params.get('actions'); return a ? JSON.parse(a) : null; } catch (e) { return null; } })()
  };
  try {
    var vs = params.get('views');
    if (vs) {
      var parsed = JSON.parse(vs);
      if (Array.isArray(parsed) && parsed.length) cfg.views = parsed;
    }
  } catch (e) { cfg.views = null; }
  if (!cfg.views) {
    cfg.views = [{ name: 'default', skel: cfg.skel, atlas: cfg.atlas, png: cfg.png }];
  }
  canvas.width = cfg.width;
  canvas.height = cfg.height;

  var context = new spine.webgl.ManagedWebGLRenderingContext(canvas, {
    alpha: true, premultipliedAlpha: true, antialias: true, preserveDrawingBuffer: true
  });
  var gl = context.gl;
  gl.viewport(0, 0, cfg.width, cfg.height);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);

  var scene = null;
  var views = [];           // [{key, skeletonData, skeleton, state, boundsInfo, animations}]
  var currentView = null;
  var ready = false, loadError = null;
  var unionBounds = null;

  function hexBg(hex) {
    hex = String(hex).replace('#', '');
    var r = parseInt(hex.slice(0, 2), 16) / 255;
    var g = parseInt(hex.slice(2, 4), 16) / 255;
    var b = parseInt(hex.slice(4, 6), 16) / 255;
    var a = hex.length >= 8 ? parseInt(hex.slice(6, 8), 16) / 255 : 1;
    return { r: r, g: g, b: b, a: a };
  }

  function fetchBuf(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('fetch ' + url + ' -> ' + r.status); return r.arrayBuffer(); });
  }
  function fetchText(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('fetch ' + url + ' -> ' + r.status); return r.text(); });
  }

  function collectBounds(skeleton) {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    var verts = new Float32Array(1024);
    var drawOrder = skeleton.drawOrder;
    for (var i = 0; i < drawOrder.length; i++) {
      var slot = drawOrder[i];
      var attachment = slot.getAttachment();
      if (!attachment) continue;
      var count = 0;
      if (attachment instanceof spine.RegionAttachment) {
        attachment.computeWorldVertices(slot.bone, verts, 0, 2);
        count = 4;
      } else if (attachment instanceof spine.VertexAttachment) {
        count = attachment.worldVerticesLength >> 1;
        attachment.computeWorldVertices(slot, 0, attachment.worldVerticesLength, verts, 0, 2);
      }
      for (var v = 0; v < count; v++) {
        var x = verts[v * 2], y = verts[v * 2 + 1];
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
  }

  function samplePoseAndCollectBounds(v) {
    var union = null;
    function add(b) {
      if (!b || !isFinite(b.minX)) return;
      if (!union) union = { minX: b.minX, minY: b.minY, maxX: b.maxX, maxY: b.maxY };
      else {
        union.minX = Math.min(union.minX, b.minX);
        union.minY = Math.min(union.minY, b.minY);
        union.maxX = Math.max(union.maxX, b.maxX);
        union.maxY = Math.max(union.maxY, b.maxY);
      }
    }
    v.skeleton.setToSetupPose();
    v.skeleton.updateWorldTransform();
    add(collectBounds(v.skeleton));
    var anims = v.skeletonData.animations;
    for (var i = 0; i < anims.length; i++) {
      var anim = anims[i];
      if (anim.duration <= 0) continue;
      if (cfg.actions && cfg.actions.indexOf(anim.name) < 0) continue;
      // sample 12 poses across the animation so large-amplitude moves
      // (e.g. wide arm swings) are included in the auto-fit bounds; sparse
      // sampling makes the character look small and the export blurry
      var times = [];
      for (var k = 0; k < 12; k++) times.push(anim.duration * (0.015 + k * 0.085));
      times.push(anim.duration * 0.99);
      for (var t = 0; t < times.length; t++) {
        v.skeleton.setToSetupPose();
        v.state.setAnimation(0, anim.name, true);
        v.state.update(Math.max(0.0001, times[t]));
        v.state.apply(v.skeleton);
        v.skeleton.updateWorldTransform();
        add(collectBounds(v.skeleton));
      }
    }
    return union || { minX: -100, minY: -100, maxX: 100, maxY: 100 };
  }

  function fitCamera() {
    if (!unionBounds) return;
    var bw = unionBounds.maxX - unionBounds.minX;
    var bh = unionBounds.maxY - unionBounds.minY;
    if (bw <= 0 || bh <= 0) { bw = Math.max(bw, 1); bh = Math.max(bh, 1); }
    var scale = Math.min(cfg.width / bw, cfg.height / bh) * cfg.fit;
    scene.camera.zoom = 1 / scale;
    scene.camera.position.x = unionBounds.minX + bw / 2;
    scene.camera.position.y = unionBounds.minY + bh / 2;
    scene.camera.update();
  }

  function draw() {
    var bg = hexBg(cfg.background);
    gl.clearColor(bg.r, bg.g, bg.b, bg.a);
    gl.clear(gl.COLOR_BUFFER_BIT);
    scene.begin();
    if (currentView) scene.drawSkeleton(currentView.skeleton, cfg.premultipliedAlpha);
    scene.end();
  }

  function resolveView(name) {
    if (!name) return views[0] || null;
    for (var i = 0; i < views.length; i++) if (views[i].key === name) return views[i];
    return views[0] || null;
  }

  async function loadOne(vw) {
    var key = vw.name || 'default';
    var skelBuf = await fetchBuf(vw.skel);
    var atlasText = await fetchText(vw.atlas);
    var pngSet = {};
    atlasText.split(/\r?\n/).forEach(function (line) {
      var m = line.match(/^([A-Za-z0-9_\-.\/]+\.png)\s*$/i);
      if (m) pngSet[m[1]] = true;
    });
    var base = vw.png.slice(0, vw.png.lastIndexOf('/') + 1);
    if (Object.keys(pngSet).length === 0) pngSet[vw.png.split('/').pop()] = true;
    var bitmaps = {};
    var pngNames = Object.keys(pngSet);
    for (var i = 0; i < pngNames.length; i++) {
      var url = base + pngNames[i];
      var r = await fetch(url);
      if (!r.ok) {
        var r2 = await fetch(vw.png);
        if (!r2.ok) throw new Error('fetch ' + url + ' -> ' + r.status);
        bitmaps[pngNames[i]] = await createImageBitmap(await r2.blob());
      } else {
        bitmaps[pngNames[i]] = await createImageBitmap(await r.blob());
      }
    }
    var atlas = new spine.TextureAtlas(atlasText, function (path) {
      var bitmap = bitmaps[path];
      if (!bitmap) throw new Error('no texture bitmap for ' + path);
      var tex = new spine.webgl.GLTexture(context, bitmap);
      tex.setFilters(spine.TextureFilter.Linear, spine.TextureFilter.Linear);
      return tex;
    });
    var atlasLoader = new spine.AtlasAttachmentLoader(atlas);
    var skeletonData = new spine.SkeletonBinary(atlasLoader).readSkeletonData(new Uint8Array(skelBuf));
    var skeleton = new spine.Skeleton(skeletonData);
    var stateData = new spine.AnimationStateData(skeletonData);
    stateData.defaultMix = cfg.mix;
    var state = new spine.AnimationState(stateData);
    var v = { key: key, skeletonData: skeletonData, skeleton: skeleton, state: state, boundsInfo: null, animations: [] };
    v.boundsInfo = samplePoseAndCollectBounds(v);
    v.animations = skeletonData.animations.map(function (a) { return { name: a.name, duration: a.duration }; });
    return v;
  }

  var studio = {
    config: cfg,
    async load() {
      try {
        scene = new spine.webgl.SceneRenderer(canvas, context, true);
        scene.camera.setViewport(cfg.width, cfg.height);
        views = [];
        unionBounds = null;
        for (var i = 0; i < cfg.views.length; i++) {
          var v = await loadOne(cfg.views[i]);
          views.push(v);
          if (!unionBounds) unionBounds = v.boundsInfo;
          else {
            unionBounds.minX = Math.min(unionBounds.minX, v.boundsInfo.minX);
            unionBounds.minY = Math.min(unionBounds.minY, v.boundsInfo.minY);
            unionBounds.maxX = Math.max(unionBounds.maxX, v.boundsInfo.maxX);
            unionBounds.maxY = Math.max(unionBounds.maxY, v.boundsInfo.maxY);
          }
        }
        currentView = views[0] || null;
        fitCamera();
        ready = true;
        return { ok: true, views: views.map(function (v) { return { name: v.key, animations: v.animations }; }), animations: views.length ? views[0].animations : [], bounds: unionBounds };
      } catch (err) {
        loadError = String(err && err.stack || err);
        return { ok: false, error: loadError };
      }
    },
    step(params) {
      if (!ready) throw new Error('studio not ready: ' + loadError);
      var action = params.action;
      var loop = !!params.loop;
      var delta = typeof params.delta === 'number' ? params.delta : 1 / 30;
      var ts = typeof params.timeScale === 'number' && params.timeScale > 0 && isFinite(params.timeScale) ? params.timeScale : 1;
      var restart = !!params.restart;
      var target = resolveView(params.view);
      if (!target) throw new Error('no skeleton loaded');
      var switched = target !== currentView;
      if (switched) { currentView = target; target.state.clearTracks(); }
      var requested = action;
      if (action !== target._lastAction || ts !== target._lastScale || switched || restart) {
        if (!target.skeletonData.findAnimation(action)) {
          action = target.skeletonData.animations.length ? target.skeletonData.animations[0].name : null;
          if (!action) throw new Error('skeleton has no animations');
        }
        var entry = target.state.setAnimation(0, action, loop);
        entry.timeScale = ts;
        target._lastAction = action;
        target._lastScale = ts;
      }
      target.state.update(delta);
      target.state.apply(target.skeleton);
      target.skeleton.updateWorldTransform();
      draw();
      return { ok: true, view: target.key, action: currentView._lastAction, fallback: requested !== currentView._lastAction };
    },
    reset() {
      for (var i = 0; i < views.length; i++) { views[i].state.clearTracks(); views[i]._lastAction = null; }
      if (currentView) currentView.skeleton.setToSetupPose();
      return { ok: true };
    },
    snapshot() {
      if (!ready) throw new Error('studio not ready');
      var w = canvas.width, h = canvas.height;
      var pixels = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      // WebGL origin is bottom-left: flip vertically; values are
      // premultiplied: convert back to straight alpha.
      var out = new Uint8Array(w * h * 4);
      for (var y = 0; y < h; y++) {
        var srcRow = (h - 1 - y) * w * 4;
        var dstRow = y * w * 4;
        for (var x = 0; x < w; x++) {
          var si = srcRow + x * 4, di = dstRow + x * 4;
          var a = pixels[si + 3];
          out[di + 3] = a;
          if (a === 0) { out[di] = 0; out[di + 1] = 0; out[di + 2] = 0; }
          else {
            out[di] = Math.min(255, Math.round(pixels[si] * 255 / a));
            out[di + 1] = Math.min(255, Math.round(pixels[si + 1] * 255 / a));
            out[di + 2] = Math.min(255, Math.round(pixels[si + 2] * 255 / a));
          }
        }
      }
      var binary = '';
      var CHUNK = 0x8000;
      for (var i = 0; i < out.length; i += CHUNK) {
        binary += String.fromCharCode.apply(null, out.subarray(i, i + CHUNK));
      }
      return 'data:image/raw;base64,' + btoa(binary);
    },
    stepAndSnapshot(params) {
      var r = this.step(params);
      if (!r || !r.ok) return r;
      r.dataUrl = this.snapshot();
      return r;
    },
    stepMany(params) {
      // advance through a list of step params without rendering snapshots
      if (!ready) throw new Error('studio not ready');
      var list = params && params.frames || [];
      for (var i = 0; i < list.length; i++) {
        var r = this.step(list[i]);
        if (!r || !r.ok) return { ok: false, error: 'step failed at ' + i };
      }
      return { ok: true };
    },
    async renderFrames(params) {
      // Render a batch of frames and POST the raw premultiplied RGBA bytes to
      // the local frame server (zero base64/JSON overhead). One round-trip
      // per batch instead of per frame.
      if (!ready) throw new Error('studio not ready');
      var list = params && params.frames || [];
      var w = canvas.width, h = canvas.height;
      var size = w * h * 4;
      var total = new Uint8Array(size * list.length);
      var r = null;
      for (var i = 0; i < list.length; i++) {
        r = this.step(list[i]);
        if (!r || !r.ok) return { ok: false, error: 'step failed at ' + i + (r && r.error ? ': ' + r.error : '') };
        var pixels = new Uint8Array(size);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        total.set(pixels, i * size);
      }
      var resp = await fetch(location.origin + '/frame?batch=' + params.batch + '&count=' + list.length, {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: total.buffer,
      });
      if (!resp.ok) return { ok: false, error: 'frame post failed: HTTP ' + resp.status };
      return { ok: true, count: list.length, fallback: r && r.fallback };
    },
    ready() { return ready; },
    error() { return loadError; }
  };
  window.studio = studio;
})();
</script>
</body>
</html>
